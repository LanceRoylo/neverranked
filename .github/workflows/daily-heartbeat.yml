name: Daily autonomy heartbeat

# Runs the autonomy heartbeat from GitHub Actions infrastructure --
# independent of the dashboard's Cloudflare cron, which we know is
# unreliable per the 2026-05-09 autonomy audit. If a critical
# automation goes silent, this catches it within 24 hours and opens
# a GitHub Issue.
#
# Manual run: Actions tab -> Daily autonomy heartbeat -> Run workflow.

on:
  schedule:
    # 12:00 UTC daily = 2am HST. Lands six hours after the dashboard's
    # 06:00 UTC daily cron has had time to fire and 12 hours after
    # the Monday weekly extras. Late enough to detect today's
    # failure, early enough to leave a workday window for a fix.
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  # issues: write dropped 2026-07-27 with the issue-opening step. This
  # workflow now only needs to commit the autonomy log.
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install wrangler
        run: npm install --global wrangler@4

      - name: Run heartbeat
        id: heartbeat
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Email escalation. Without these two the heartbeat still runs and
          # still logs, but it can only reach GitHub issues -- which is the
          # channel that swallowed 79 consecutive alerts through 2026-07-27.
          # The script reports "NOT SENT" loudly in its log when they are
          # absent, so a missing secret cannot masquerade as a quiet day.
          OPS_NOTIFY_URL: ${{ secrets.OPS_NOTIFY_URL }}
          MEASUREMENT_TOKEN: ${{ secrets.MEASUREMENT_TOKEN }}
        run: |
          set +e
          node scripts/heartbeat.mjs --log-to-file > /tmp/heartbeat.txt 2>&1
          HEARTBEAT_EXIT=$?
          echo "exit_code=$HEARTBEAT_EXIT" >> $GITHUB_OUTPUT
          cat /tmp/heartbeat.txt
          {
            echo "report<<EOF"
            cat /tmp/heartbeat.txt
            echo "EOF"
          } >> $GITHUB_OUTPUT
          exit 0  # never fail the workflow itself; we use exit_code below

      - name: Commit autonomy log
        run: |
          git config user.name 'neverranked-bot'
          git config user.email 'bot@neverranked.com'
          git add content/autonomy-log/
          if git diff --cached --quiet; then
            echo "No log changes to commit."
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "Autonomy log: $DATE"
            git push
          fi

      # ISSUE-OPENING STEP REMOVED 2026-07-27.
      #
      # This step opened a GitHub issue on every red run. By 2026-07-27
      # there were 79 open heartbeat issues, one per day since 2026-05-10,
      # and zero had ever been closed or read. Real failures went unseen
      # for 67 days (a dead HTTP check) and 77 days (the customer digest)
      # while this loyally filed report after report into a channel nobody
      # opens.
      #
      # Detection was never the problem. The channel was. Escalation now
      # goes to email, on TRANSITION rather than daily state, through the
      # measurement watchdog's proven /measurement/notify path, and the
      # script writes a Notification: line into the autonomy log so the
      # delivery itself is auditable. See scripts/heartbeat.mjs.
      #
      # A third channel nobody reads would add noise, not safety. The
      # git-tracked autonomy log under content/autonomy-log/ remains the
      # durable record, and it is committed by the step above.
