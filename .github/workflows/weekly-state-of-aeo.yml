name: Weekly State of AEO

# Regenerates the State of AEO report every Monday and commits the
# refreshed markdown + PDF + public web pages back to main, which then
# triggers the homepage deploy workflow automatically.
#
# Manual run: Actions tab -> Weekly State of AEO -> Run workflow.

# SCHEDULE DISABLED 2026-07-27. State of AEO is retired.
#
# The web surface was pruned 2026-07-01 with a 301 map to /teardowns/
# (see _redirects and the DIRS list in scripts/build.sh). This workflow
# kept running weekly anyway and had not succeeded since 2026-05-11:
# 11 of its last 13 runs failed on "wrangler d1 execute failed" with an
# oversized result set. So for 26 days it spent CI minutes and Anthropic
# API calls every Monday to generate a report for a surface that no
# longer exists, and then failed.
#
# The digest block that consumed state-of-aeo/latest.json is removed in
# the same change, so nothing reads the output any more.
#
# Kept as workflow_dispatch rather than deleted: the generator and the
# report archive are the only record of how these were produced, and
# un-retiring is a content decision someone may revisit. Running it by
# hand will still fail until the D1 result-size bug is fixed.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install pandoc and Playwright deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          npx --yes playwright@latest install --with-deps chromium

      - name: Install wrangler
        run: npm install --global wrangler@4

      - name: Generate State of AEO markdown
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          OUT="reports/state-of-aeo/state-of-aeo-${DATE}.md"
          mkdir -p reports/state-of-aeo
          node scripts/state-of-aeo-generate.mjs --output="$OUT"
          echo "REPORT_DATE=$DATE" >> $GITHUB_ENV
          echo "REPORT_MD=$OUT" >> $GITHUB_ENV

      - name: Render PDF
        run: |
          npm install --no-save @playwright/test
          node scripts/report-pdf.mjs "$REPORT_MD" \
            --title="The State of AEO" \
            --subtitle="NeverRanked tracked-universe report, week of $REPORT_DATE"

      - name: Publish web hub
        run: node scripts/state-of-aeo-publish.mjs

      - name: Refresh dist/
        run: bash scripts/build.sh

      - name: Commit if changed
        run: |
          git config user.name 'neverranked-bot'
          git config user.email 'bot@neverranked.com'
          git add reports/state-of-aeo/ state-of-aeo/ dist/state-of-aeo/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly State of AEO: $REPORT_DATE"
            git push
          fi
